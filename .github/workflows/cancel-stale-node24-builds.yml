name: Cancel superseded Node 24 build attempts

on:
  push:
    branches:
      - experiment/node24-runtime-package
    paths:
      - ".github/workflows/cancel-stale-node24-builds.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the accidental full rebuilds and stale package attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for run_id in 40613747559 40613780084 40614852412; do
            echo "Cancelling superseded run $run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"
          done
