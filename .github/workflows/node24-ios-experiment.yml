name: Node 24 iOS isolated experiment

on:
  push:
    branches:
      - experiment/node24-ios-20261027
    paths:
      - ".github/workflows/node24-ios-experiment.yml"
      - "experiments/node24/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-node24-ios-arm64:
    name: Build NodeMobile 24.5.0 for iPhoneOS arm64
    runs-on: macos-15

    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4

      - name: Checkout isolated nodejs-mobile source
        uses: actions/checkout@v4
        with:
          repository: ybaelli/nodejs-mobile
          ref: 4608d3c670cf37b383dbe631de4992cf23da46e0
          path: nodejs-mobile
          fetch-depth: 1

      - name: Show toolchain
        run: |
          uname -a
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          clang --version | head -n 1

      - name: Verify source identity
        working-directory: nodejs-mobile
        run: |
          grep -E '^#define NODE_(MAJOR|MINOR|PATCH)_VERSION' src/node_version.h
          python3 - <<'PY'
          import re
          text=open("src/node_version.h",encoding="utf-8").read()
          vals={k:int(v) for k,v in re.findall(r"#define NODE_(MAJOR|MINOR|PATCH)_VERSION\s+(\d+)",text)}
          version=f"{vals['MAJOR']}.{vals['MINOR']}.{vals['PATCH']}"
          print("node source version:",version)
          if version!="24.5.0":
              raise SystemExit(f"unexpected Node version {version}")
          PY

      - name: Bound build parallelism
        working-directory: nodejs-mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("tools/ios_framework_prepare.sh")
          s=p.read_text()
          s=s.replace('make -j$(getconf _NPROCESSORS_ONLN)','make -j4')
          s=s.replace('arch -x86_64 make -j$(getconf _NPROCESSORS_ONLN)','arch -x86_64 make -j4')
          p.write_text(s)
          PY

      - name: Install ccache
        run: |
          brew install ccache
          ccache --version

      - name: Restore Node 24 compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache-node24-ios
          key: node24-ios-arm64-macos15-4608d3c6-${{ runner.arch }}-${{ hashFiles('.github/workflows/node24-ios-experiment.yml') }}
          restore-keys: |
            node24-ios-arm64-macos15-4608d3c6-${{ runner.arch }}-

      - name: Build NodeMobile framework
        working-directory: nodejs-mobile
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.cache/ccache-node24-ios"
          export CCACHE_MAXSIZE=3G
          export CCACHE_COMPRESS=true
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE/nodejs-mobile"
          export CC="ccache clang"
          export CXX="ccache clang++"
          ccache -z
          bash tools/ios_framework_prepare.sh arm64 > ../node24-build.log 2>&1
          ccache -s

      - name: Save Node 24 compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache-node24-ios
          key: node24-ios-arm64-macos15-4608d3c6-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show ccache statistics
        if: always()
        run: ccache -s || true

      - name: Show build log tail on failure
        if: failure()
        run: |
          if [ -f node24-build.log ]; then
            echo "===== node24-build.log tail ====="
            tail -n 400 node24-build.log
          else
            echo "node24-build.log was not created"
          fi

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NodeMobile-24.5.0-ios-arm64-build-log
          path: node24-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify iPhoneOS framework
        working-directory: nodejs-mobile
        run: |
          set -e
          FRAMEWORK="out_ios_arm64/iphoneos-arm64/Release-iphoneos/NodeMobile.framework"
          test -f "$FRAMEWORK/NodeMobile"
          file "$FRAMEWORK/NodeMobile"
          lipo -info "$FRAMEWORK/NodeMobile"
          xcrun dwarfdump --uuid "$FRAMEWORK/NodeMobile" || true
          test -f src/node.h
          mkdir -p ../node24-artifact
          cp -R "$FRAMEWORK" ../node24-artifact/
          cp src/node_version.h ../node24-artifact/
          cp src/node.h ../node24-artifact/
          cp src/node_api.h ../node24-artifact/
          python3 - <<'PY'
          import json, subprocess, pathlib, platform
          root=pathlib.Path("../node24-artifact")
          info={
            "node_version":"24.5.0",
            "source_repo":"ybaelli/nodejs-mobile",
            "source_commit":"4608d3c670cf37b383dbe631de4992cf23da46e0",
            "source_pr":"nodejs-mobile/nodejs-mobile#158",
            "target":"iphoneos-arm64",
            "runner_arch":platform.machine(),
            "framework_file":subprocess.check_output(["file",str(root/"NodeMobile.framework/NodeMobile")],text=True).strip(),
          }
          (root/"experiment-build-info.json").write_text(json.dumps(info,indent=2)+"\n")
          print(json.dumps(info,indent=2))
          PY
          tar -czf NodeMobile-24.5.0-ios-arm64.tar.gz -C ../node24-artifact .
          shasum -a 256 NodeMobile-24.5.0-ios-arm64.tar.gz

      - name: Upload isolated experiment artifact
        uses: actions/upload-artifact@v4
        with:
          name: NodeMobile-24.5.0-ios-arm64
          path: nodejs-mobile/NodeMobile-24.5.0-ios-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
