name: Node 24 iOS Runtime package test

on:
  push:
    branches:
      - experiment/node24-runtime-package
    paths:
      - ".github/workflows/node24-ios-experiment.yml"
      - "experiments/node24/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: node24-runtime-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-node24-ios-arm64:
    name: Build complete NodeRuntime 24.5.0 for iPhoneOS arm64
    runs-on: macos-15

    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4

      - name: Checkout isolated nodejs-mobile source
        uses: actions/checkout@v4
        with:
          repository: ybaelli/nodejs-mobile
          ref: 4608d3c670cf37b383dbe631de4992cf23da46e0
          path: nodejs-mobile
          fetch-depth: 1

      - name: Show toolchain and initial disk
        run: |
          uname -a
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version
          clang --version | head -n 1
          df -h "$GITHUB_WORKSPACE"

      - name: Verify source identity and package-manager versions
        working-directory: nodejs-mobile
        run: |
          set -e
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          text=Path("src/node_version.h").read_text()
          vals={k:int(v) for k,v in re.findall(r"#define NODE_(MAJOR|MINOR|PATCH)_VERSION\s+(\d+)",text)}
          version=f"{vals['MAJOR']}.{vals['MINOR']}.{vals['PATCH']}"
          npm=json.loads(Path("deps/npm/package.json").read_text())["version"]
          corepack=json.loads(Path("deps/corepack/package.json").read_text())["version"]
          print(f"Node={version} npm={npm} Corepack={corepack}")
          if (version,npm,corepack)!=("24.5.0","11.5.1","0.34.0"):
              raise SystemExit("unexpected source/package-manager versions")
          PY

      - name: Download existing NodeMobile.framework from successful build
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/node24-framework-artifact"
          mkdir -p "$DEST"
          # Reuse the already successful run; do not rebuild Node/V8.
          gh run download 40596037615 --repo "$GITHUB_REPOSITORY" --name NodeMobile-24.5.0-ios-arm64 --dir "$DEST"
          ARCHIVE="$DEST/NodeMobile-24.5.0-ios-arm64.tar.gz"
          test -s "$ARCHIVE"
          python3 - "$ARCHIVE" "$DEST" <<'PY'
          import json, sys, tarfile
          from pathlib import Path
          archive=Path(sys.argv[1]); dest=Path(sys.argv[2])
          with tarfile.open(archive, "r:gz") as tf:
              names=set(tf.getnames())
              info_name=next((n for n in names if n.lstrip("./")=="experiment-build-info.json"),None)
              framework_name=next((n for n in names if n.lstrip("./")=="NodeMobile.framework"),None)
              if not info_name or not framework_name:
                  raise SystemExit("reused artifact does not contain framework/build metadata")
              info=json.load(tf.extractfile(info_name))
              expected={"node_version":"24.5.0","source_repo":"ybaelli/nodejs-mobile","source_commit":"4608d3c670cf37b383dbe631de4992cf23da46e0","target":"iphoneos-arm64"}
              for key,value in expected.items():
                  if info.get(key)!=value:
                      raise SystemExit(f"artifact mismatch: {key}={info.get(key)!r}, expected {value!r}")
              # Extract only the framework, not unrelated archive entries.
              member=tf.getmember(framework_name)
              member.name="NodeMobile.framework"
              tf.extract(member, dest, filter="data")
              (dest/"experiment-build-info.json").write_text(json.dumps(info,indent=2)+"\n")
          print(json.dumps(info,indent=2))
          PY
          FRAMEWORK_DIR="$GITHUB_WORKSPACE/nodejs-mobile/out_ios_arm64/iphoneos-arm64/Release-iphoneos"
          mkdir -p "$FRAMEWORK_DIR"
          cp -R "$DEST/NodeMobile.framework" "$FRAMEWORK_DIR/NodeMobile.framework"
          file "$FRAMEWORK_DIR/NodeMobile.framework/NodeMobile"
          lipo -info "$FRAMEWORK_DIR/NodeMobile.framework/NodeMobile"

      - name: Configure matching Node 24 headers without compiling V8
        working-directory: nodejs-mobile
        run: |
          set -euo pipefail
          # configure generates config.gypi required by the devkit header packer.
          # This is configuration only; deliberately do not run make/xcodebuild.
          export GYP_DEFINES="target_arch=arm64 host_os=mac target_os=ios"
          ./configure \
            --dest-os=ios \
            --dest-cpu=arm64 \
            --with-intl=none \
            --cross-compiling \
            --enable-static \
            --openssl-no-asm \
            --v8-options=--jitless \
            --without-node-code-cache \
            --without-node-snapshot
          bash tools/copy_libnode_headers.sh ios
          test -s out_ios/libnode/include/node/node.h
          test -s out_ios/libnode/include/node/config.gypi
          echo "Node 24 headers/config staged; V8 framework compilation skipped."
      - name: Assemble complete CodexApp NodeRuntime
        env:
          NODE_RUNTIME_JOBS: "4"
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/experiments/node24/runtime-build"
          mkdir -p "$ROOT/.cache"
          ln -s "$GITHUB_WORKSPACE/nodejs-mobile" "$ROOT/.cache/nodejs-mobile-4608d3c670cf"
          python3 "$ROOT/scripts/build-node-runtime.py" --reuse-framework --jobs 4 2>&1 | tee "$GITHUB_WORKSPACE/node24-runtime-package.log"
          python3 "$ROOT/scripts/pack-node-runtime.py" 2>&1 | tee -a "$GITHUB_WORKSPACE/node24-runtime-package.log"
          file "$ROOT/NodeRuntime/bin/node"
          lipo -info "$ROOT/NodeRuntime/bin/node"
          file "$ROOT/NodeRuntime/Frameworks/NodeMobile.framework/NodeMobile"
          lipo -info "$ROOT/NodeRuntime/Frameworks/NodeMobile.framework/NodeMobile"
          python3 - <<'PY'
          import hashlib, json, tarfile
          from pathlib import Path
          root=Path("experiments/node24/runtime-build")
          archive=root/"NodeRuntime.tar.gz"
          bundle=json.loads((root/"NodeRuntime.bundle.json").read_text())
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          assert bundle["node_version"]=="24.5.0", bundle.get("node_version")
          assert bundle["npm_version"]=="11.5.1", bundle.get("npm_version")
          assert bundle["corepack_version"]=="0.34.0", bundle.get("corepack_version")
          assert bundle["archive_sha256"]==digest, (bundle["archive_sha256"],digest)
          with tarfile.open(archive,"r:gz") as tf:
              names=set(tf.getnames())
          required={
            "bin/node","bin/npm","bin/npx","bin/corepack",
            "lib/node_modules/npm/bin/npm-cli.js",
            "lib/node_modules/corepack/dist/corepack.js",
            "lib/codex/ios-bootstrap.js",
            "devkit/node/include/node/node.h",
            "devkit/node/include/node/config.gypi",
            "Frameworks/NodeMobile.framework/NodeMobile",
            "manifest.json",
          }
          missing=sorted(required-names)
          if missing:
              raise SystemExit("archive missing required paths: "+", ".join(missing))
          print(json.dumps({
            "archive":str(archive),
            "archive_bytes":archive.stat().st_size,
            "sha256":digest,
            "revision":bundle["revision"],
            "node":bundle["node_version"],
            "npm":bundle["npm_version"],
            "corepack":bundle["corepack_version"],
            "files":bundle["file_count"],
            "tar_bytes":bundle["tar_bytes"],
            "payload_bytes":bundle["payload_bytes"],
          },indent=2))
          PY
          mkdir -p "$GITHUB_WORKSPACE/test-runtime"
          cp "$ROOT/NodeRuntime.tar.gz" "$GITHUB_WORKSPACE/test-runtime/NodeRuntime.tar.gz"
          cp "$ROOT/NodeRuntime.bundle.json" "$GITHUB_WORKSPACE/test-runtime/NodeRuntime.bundle.json"
          cp "$ROOT/NodeRuntime/manifest.json" "$GITHUB_WORKSPACE/test-runtime/NodeRuntime.manifest.json"
          cp "$ROOT/NodeRuntime/.build-info.json" "$GITHUB_WORKSPACE/test-runtime/NodeRuntime.build-info.json"
          cat > "$GITHUB_WORKSPACE/test-runtime/README.txt" <<'EOF'
          CodexApp NodeRuntime 24.5.0 iOS arm64 — TEST CANDIDATE ONLY
          
          This is a complete portable-v1 Node Runtime package built from the isolated
          ybaelli/nodejs-mobile source commit 4608d3c670cf37b383dbe631de4992cf23da46e0.
          It is not published in the production Runtime catalog and does not replace
          the existing Node 18.20.4 JITless Runtime.
          
          Includes NodeMobile.framework, an arm64 launcher, npm 11.5.1, Corepack 0.34.0,
          CodexApp iOS JS compatibility shims, and matching Node/V8/libuv/OpenSSL devkit
          headers/configuration. The iOS build remains JITless; this package does not
          claim to enable WebAssembly.
          
          Do not overwrite the production Runtime manifest. Validate on a test device
          and keep the existing Node 18 Runtime available for rollback.
          EOF
          (cd "$GITHUB_WORKSPACE/test-runtime" && shasum -a 256 NodeRuntime.tar.gz NodeRuntime.bundle.json NodeRuntime.manifest.json NodeRuntime.build-info.json > SHA256SUMS)
          cat "$GITHUB_WORKSPACE/test-runtime/SHA256SUMS"

      - name: Upload complete NodeRuntime test package
        uses: actions/upload-artifact@v4
        with:
          name: NodeRuntime-24.5.0-ios-arm64-test
          path: test-runtime/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NodeRuntime-24.5.0-build-logs
          path: |
            node24-build.log
            node24-runtime-package.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Show disk and build diagnostics on failure
        if: failure()
        run: |
          df -h "$GITHUB_WORKSPACE" || true
          du -sh nodejs-mobile/out* 2>/dev/null || true
          if [ -f node24-build.log ]; then
            tail -n 250 node24-build.log
          fi
          if [ -f node24-runtime-package.log ]; then
            tail -n 250 node24-runtime-package.log
          fi
